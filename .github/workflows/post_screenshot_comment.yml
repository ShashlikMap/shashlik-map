name: Post Screenshot to PR

on:
  workflow_run:
    workflows: ["WGPU Headless Screenshot"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-screenshot:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: headless-screenshot
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check if screenshot exists
        id: check_screenshot
        run: |
          if [ -f output.png ]; then
            echo "screenshot_exists=true" >> $GITHUB_OUTPUT
          else
            echo "screenshot_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Find associated PR
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            let prNumber = null;
            for (const pr of pullRequests) {
              if (pr.head.sha === '${{ github.event.workflow_run.head_sha }}') {
                prNumber = pr.number;
                break;
              }
            }
            
            if (prNumber) {
              core.setOutput('pr_number', prNumber);
            }

      - name: Post screenshot comment to PR
        if: steps.check_screenshot.outputs.screenshot_exists == 'true' && steps.find_pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = '${{ steps.find_pr.outputs.pr_number }}';
            const workflowRunId = '${{ github.event.workflow_run.id }}';
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${workflowRunId}`;
            
            // Read and encode screenshot as base64
            const imageBuffer = fs.readFileSync('output.png');
            const base64Image = imageBuffer.toString('base64');
            const imageSize = (imageBuffer.length / 1024).toFixed(2); // Size in KB
            
            // Create markdown with base64 data URL (with size limit check)
            let body;
            if (base64Image.length > 60000) {
              // If still too large, post link instead
              body = `## 📸 Screenshot Preview\n\n✅ Screenshot captured successfully!\n\n[Download Screenshot](${artifactUrl}) (${imageSize} KB)`;
            } else {
              // Use data URL if small enough
              const imageDataUrl = 'data:image/png;base64,' + base64Image;
              body = `## 📸 Screenshot Preview\n\n![Headless WGPU Screenshot](${imageDataUrl})\n\n✅ Screenshot captured successfully from headless WGPU application.`;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body
            });
            
            console.log(`Posted screenshot comment to PR #${prNumber} (size: ${base64Image.length} chars)`);

      - name: Post failure message
        if: steps.check_screenshot.outputs.screenshot_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            let prNumber = null;
            for (const pr of pullRequests) {
              if (pr.head.sha === '${{ github.event.workflow_run.head_sha }}') {
                prNumber = pr.number;
                break;
              }
            }
            
            if (!prNumber) return;
            
            const body = `## ⚠️ Screenshot Generation Failed\n\nThe headless WGPU application did not generate a screenshot. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}) for details.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
