name: Build and Release Apps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Rust App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build production release
        run: |
          cargo build --release --target aarch64-apple-darwin --package winit-run --bin winit-run
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/winit-run dist/shashlik-map-mac
          cd dist && zip shashlik-map-mac.zip shashlik-map-mac
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: dist/shashlik-map-mac.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

      - name: Rename APK file
        run: |
          mv demo/composeApp/build/outputs/apk/release/composeApp-release.apk demo/composeApp/build/outputs/apk/release/shashlik-map-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: kmp/demo/composeApp/build/outputs/apk/release/shashlik-map-release.apk

  publish-release:
    name: Create GitHub Release
    needs: [ build-mac, build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-artifact
          path: ./downloads
          merge-multiple: true

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: ./downloads
          merge-multiple: true

      - name: Generate Version Tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            CHANGELOG=$(git log $LATEST_TAG..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          echo "commits=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          body: |
            **Release Date:** ${{ steps.tag.outputs.release_tag }}
            
            ## Release Contents
            - macOS app (Apple Silicon)
            - Android APK
            
            ## Changes
            ${{ steps.changelog.outputs.commits }}
          draft: false
          prerelease: false
          files: |
            ./downloads/shashlik-map-mac.zip
            ./downloads/shashlik-map-release.apk
