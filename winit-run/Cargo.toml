[package]
name = "winit-run"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osm = { workspace = true }
map = { path = "../map" }
renderer = { path = "../renderer" }
wgpu-canvas = { workspace = true}
env_logger = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true}
winit = { workspace = true }
app-surface = { workspace = true, features = ["winit"] }
futures-lite = "2.6.1"
native-dialog = "0.9.3"

slint = { git = "https://github.com/slint-ui/slint.git", branch = "pre-release/1.15", features = ["unstable-wgpu-28", "unstable-winit-030"]}
i-slint-backend-winit = { git = "https://github.com/slint-ui/slint.git", branch = "pre-release/1.15" }
bytemuck = "1.25.0"

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint.git", branch = "pre-release/1.15" }