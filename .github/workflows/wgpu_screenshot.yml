name: WGPU Headless Screenshot

on:
  pull_request:
    branches: [ main ]

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Minimal Software Vulkan Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri pngquant

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Headless WGPU Application
        env:
          WGPU_BACKEND: vulkan
          GALLIUM_DRIVER: llvmpipe
        run: |
          cargo run --bin headless --release

      - name: Compress screenshot
        if: always()
        run: |
          if [ -f output.png ]; then
            pngquant --quality=70-90 --force --output output_temp.png output.png
            mv output_temp.png output.png
            ls -lh output.png
          else
            echo "No screenshot generated"
          fi

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-screenshot
          path: output.png
          retention-days: 1