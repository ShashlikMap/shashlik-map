name: WGPU Headless Screenshot

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri pngquant

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Headless WGPU Application
        env:
          WGPU_BACKEND: vulkan
          GALLIUM_DRIVER: llvmpipe
        run: |
          cargo run --bin headless --release

      - name: Compress screenshot
        if: always()
        run: |
          if [ -f output.png ]; then
            pngquant --quality=70-90 --force --output output_temp.png output.png
            mv output_temp.png output.png
            ls -lh output.png
          else
            echo "No screenshot generated"
          fi

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-screenshot
          path: output.png
          retention-days: 1

      - name: Post screenshot comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('output.png')) {
              console.log('No screenshot found, skipping comment');
              return;
            }
            
            const imageBuffer = fs.readFileSync('output.png');
            const base64Image = imageBuffer.toString('base64');
            const imageSize = (imageBuffer.length / 1024).toFixed(2);
            
            console.log(`Image size: ${imageSize} KB, base64 size: ${base64Image.length} chars`);
            
            if (base64Image.length > 60000) {
              console.log('Image too large for base64, posting download link only');
              const body = `## 📸 Screenshot Preview\n\n✅ Screenshot captured successfully (${imageSize} KB)!\n\nDownload from artifacts →`;
            
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } else {
              const imageDataUrl = 'data:image/png;base64,' + base64Image;
              const body = `## 📸 Screenshot Preview\n\n![Headless WGPU Screenshot](${imageDataUrl})\n\n✅ Screenshot captured successfully!`;
            
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }