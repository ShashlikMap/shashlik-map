name: WGPU Headless Screenshot

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  headless-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Headless WGPU Application
        env:
          WGPU_BACKEND: vulkan
          GALLIUM_DRIVER: llvmpipe
        run: |
          cargo run --bin headless --release

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-screenshot
          path: output.png
          retention-days: 5

      - name: Store PR metadata
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-metadata
          echo "${{ github.event.pull_request.number }}" > pr-metadata/pr_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-metadata/head_sha.txt
          echo "${{ github.event.pull_request.head.repo.full_name }}" > pr-metadata/head_repo.txt
          echo "${{ github.event.pull_request.title }}" > pr-metadata/pr_title.txt

      - name: Upload PR metadata artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata
          path: pr-metadata/
          retention-days: 5
