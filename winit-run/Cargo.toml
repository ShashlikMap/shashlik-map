[package]
name = "winit-run"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osm = { workspace = true }
map = { path = "../map" }
wgpu-canvas = { workspace = true}
env_logger = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true}
winit = { workspace = true }
app-surface = { workspace = true, features = ["winit"] }

slint = { version = "1.15.0", features = ["unstable-wgpu-28", "unstable-winit-030"]}
i-slint-backend-winit = "1.15.0"

[build-dependencies]
slint-build = "1.15.0"