name: Publish KMP SDK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish_kmp_sdk:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./kmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            aarch64-apple-ios
            aarch64-apple-ios-sim
            aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify agent docs match the code
        # The published artifact is the contract, so this is the only gate.
        # `main` is free to be broken between releases.
        run: |
          ./gradlew :shared:agentDocs --no-configuration-cache
          git diff --exit-code -- \
            ../llms.txt \
            ../README.md \
            shared/README_API.md \
            shared/agent/FACTS.md \
            shared/api/shared.api \
          || { echo "::error::Agent docs are stale. Run ./gradlew :shared:agentDocs and commit."; exit 1; }
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

      - name: Publish to MavenCentral
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
