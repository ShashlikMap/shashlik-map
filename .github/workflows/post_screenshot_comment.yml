name: Pixel Eagle Visual Regression

on:
  workflow_run:
    workflows: ["WGPU Headless Screenshot"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

env:
  PIXEL_EAGLE_TOKEN_EXISTS: ${{ (secrets.PIXEL_EAGLE_TOKEN || secrets.PIXEL_EAGLE_API_KEY) != '' }}
  PIXEL_EAGLE_URL: https://pixel-eagle.com
  SCREENSHOT_NAME: map-default-view

jobs:
  pixel-eagle:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push'

    steps:
      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: headless-screenshot
          path: screenshot
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download run metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          path: metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Read run metadata
        id: metadata
        run: |
          read_meta() {
            if [ -f "metadata/$1" ]; then tr -d '\r\n' < "metadata/$1"; fi
          }
          {
            echo "pr_number=$(read_meta pr_number.txt)"
            echo "head_sha=$(read_meta head_sha.txt)"
            echo "head_ref=$(read_meta head_ref.txt)"
            echo "base_ref=$(read_meta base_ref.txt)"
            if [ -f screenshot/output.png ]; then
              echo "screenshot=true"
            else
              echo "screenshot=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Warn about missing token
        if: ${{ ! fromJSON(env.PIXEL_EAGLE_TOKEN_EXISTS) }}
        run: |
          echo "The PIXEL_EAGLE_TOKEN secret is not set, skipping the upload to Pixel Eagle." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Pixel Eagle and compare
        id: pixel_eagle
        if: steps.metadata.outputs.screenshot == 'true' && fromJSON(env.PIXEL_EAGLE_TOKEN_EXISTS)
        env:
          PIXEL_EAGLE_TOKEN: ${{ secrets.PIXEL_EAGLE_TOKEN || secrets.PIXEL_EAGLE_API_KEY }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          HEAD_REF: ${{ steps.metadata.outputs.head_ref }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.repository.html_url }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $PIXEL_EAGLE_TOKEN"
          api="$PIXEL_EAGLE_URL"

          metadata=$(jq -nc \
            --arg branch "$HEAD_REF" \
            --arg commit "$HEAD_SHA" \
            --arg os "linux" \
            --arg event "$EVENT" \
            --arg pr "$PR_NUMBER" \
            '{branch: $branch, commit: $commit, os: $os, event: $event}
             + (if $pr == "" then {} else {pr: $pr} end)')

          run_id=$(curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$api/runs" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "$metadata" | jq -r '.id')
          echo "Created Pixel Eagle run $run_id ($metadata)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -X POST "$api/runs/$run_id" \
            -H "$auth" \
            -F "data=@screenshot/output.png" \
            -F "screenshot=$SCREENSHOT_NAME" > /dev/null
          echo "Uploaded $SCREENSHOT_NAME"

          # Runs on main only feed the baseline, there is nothing to comment on.
          if [ -z "$PR_NUMBER" ]; then
            echo "Push build: run $run_id stored as baseline, skipping comparison."
            exit 0
          fi

          # Compare against the most recent push build on main. Filtering on the
          # event too keeps a pull request branch that happens to be called "main"
          # from being picked as the baseline.
          http=$(curl -sS -o compare.json -w '%{http_code}' \
            -X POST "$api/runs/$run_id/compare/auto" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d '{"branch": "main", "event": "push"}')

          if [ "$http" != "200" ]; then
            echo "No comparison available (HTTP $http): $(cat compare.json)"
            {
              echo '<!-- pixel-eagle -->'
              echo '## 📸 Visual Regression (Pixel Eagle)'
              echo
              echo "Screenshot uploaded as run \`$run_id\`, but no baseline run on \`main\` was found to compare against."
              echo
              echo "Once this branch lands on \`main\`, its run becomes the baseline for later pull requests."
              echo
              echo "Commit \`${HEAD_SHA:0:7}\` · [workflow run]($RUN_URL)"
            } > comment.md
            exit 0
          fi

          # Diffs are computed asynchronously, poll until every one is done.
          to=$(jq -r '.to' compare.json)
          for _ in $(seq 1 24); do
            if jq -e 'all(.diff[]; .diff | type == "object" and has("Done"))' compare.json > /dev/null; then
              break
            fi
            sleep 5
            curl -sS -o compare.json "$api/runs/$run_id/compare/$to" -H "$auth"
          done

          project_id=$(jq -r '.project_id' compare.json)
          report="$api/project/$project_id/run/$run_id/compare/$to"
          changed=$(jq '[.diff[] | select(.diff | type == "object" and has("Done") and (.Done > 0))] | length' compare.json)
          new=$(jq '.new | length' compare.json)
          missing=$(jq '.missing | length' compare.json)
          unchanged=$(jq '.unchanged | length' compare.json)

          echo "changed=$changed new=$new missing=$missing unchanged=$unchanged"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          {
            echo '<!-- pixel-eagle -->'
            echo '## 📸 Visual Regression (Pixel Eagle)'
            echo
            if [ "$changed" -gt 0 ] || [ "$new" -gt 0 ] || [ "$missing" -gt 0 ]; then
              echo "⚠️ **Differences detected** — $changed changed, $new new, $missing missing, $unchanged unchanged."
            else
              echo "✅ **No visual changes** — $unchanged screenshot(s) match the baseline."
            fi
            echo
            jq -r '
              [ (.diff[] | select((.diff | type == "object") and .diff.Done > 0)
                           | "- `\(.name)` changed by \((.diff.Done * 10000 | round) / 100)%"),
                (.new[]     | "- `\(.name)` is new"),
                (.missing[] | "- `\(.name)` is missing from this run")
              ] | join("\n")' compare.json
            echo
            echo "[View the comparison report]($report) · compared against run \`$to\` on \`main\`"
            echo
            echo "Commit \`${HEAD_SHA:0:7}\` · [workflow run]($RUN_URL)"
          } > comment.md
        continue-on-error: true

      - name: Build fallback comment
        if: always() && steps.metadata.outputs.pr_number != '' && hashFiles('comment.md') == ''
        env:
          SCREENSHOT_EXISTS: ${{ steps.metadata.outputs.screenshot }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.repository.html_url }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          {
            echo '<!-- pixel-eagle -->'
            echo '## 📸 Visual Regression (Pixel Eagle)'
            echo
            if [ "$SCREENSHOT_EXISTS" != "true" ]; then
              echo "⚠️ **No screenshot was produced** — the headless render finished with \`$CONCLUSION\`."
            elif [ "$PIXEL_EAGLE_TOKEN_EXISTS" != "true" ]; then
              echo "ℹ️ The screenshot was captured but \`PIXEL_EAGLE_TOKEN\` is not configured, so it was not uploaded to Pixel Eagle."
            else
              echo "⚠️ The screenshot was captured but the upload to Pixel Eagle failed."
            fi
            echo
            echo "[View the workflow run and artifacts]($RUN_URL)"
            echo
            echo "Commit \`${HEAD_SHA:0:7}\`"
          } > comment.md

      - name: Post or update the pull request comment
        if: always() && steps.metadata.outputs.pr_number != '' && hashFiles('comment.md') != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- pixel-eagle -->';
            const issue_number = parseInt(process.env.PR_NUMBER, 10);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              console.log(`Updated comment ${existing.id} on PR #${issue_number}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              console.log(`Created comment on PR #${issue_number}`);
            }
