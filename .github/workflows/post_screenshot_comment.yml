name: Post Screenshot to PR

on:
  workflow_run:
    workflows: ["WGPU Headless Screenshot"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-screenshot:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: headless-screenshot
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Extract PR metadata
        id: metadata
        run: |
          if [ -f pr_number.txt ]; then
            PR_NUMBER=$(cat pr_number.txt)
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
          if [ -f head_sha.txt ]; then
            HEAD_SHA=$(cat head_sha.txt)
            echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          fi
          if [ -f pr_title.txt ]; then
            PR_TITLE=$(cat pr_title.txt)
            echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          fi

      - name: Check if screenshot exists
        id: check_screenshot
        run: |
          if [ -f output.png ]; then
            echo "screenshot_exists=true" >> $GITHUB_OUTPUT
          else
            echo "screenshot_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Pixel-Eagle API
        if: steps.check_screenshot.outputs.screenshot_exists == 'true' && steps.metadata.outputs.pr_number != ''
        id: pixel_eagle
        run: |
          PR_NUMBER="${{ steps.metadata.outputs.pr_number }}"
          HEAD_SHA="${{ steps.metadata.outputs.head_sha }}"
          PR_TITLE="${{ steps.metadata.outputs.pr_title }}"
          
          # Prepare screenshot file
          if [ ! -f output.png ]; then
            echo "screenshot_not_found=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Upload screenshot to Pixel-Eagle API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.PIXEL_EAGLE_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@output.png" \
            -F "project_id=ShashlikMap" \
            -F "environment=pr-${PR_NUMBER}" \
            -F "baseline_branch=main" \
            -F "metadata={\"pr_number\": ${PR_NUMBER}, \"sha\": \"${HEAD_SHA}\", \"title\": \"${PR_TITLE}\"}" \
            "https://api.pixel-eagle.com/v1/screenshots")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            COMPARISON_URL=$(echo "$RESPONSE_BODY" | grep -o '"comparison_url":"[^"]*' | cut -d'"' -f4)
            REGRESSION_COUNT=$(echo "$RESPONSE_BODY" | grep -o '"regression_count":[0-9]*' | cut -d':' -f2)
            
            echo "success=true" >> $GITHUB_OUTPUT
            echo "comparison_url=$COMPARISON_URL" >> $GITHUB_OUTPUT
            echo "regression_count=$REGRESSION_COUNT" >> $GITHUB_OUTPUT
            echo "Pixel-Eagle upload successful"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Pixel-Eagle upload failed with HTTP $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
          fi
        continue-on-error: true
        env:
          PIXEL_EAGLE_API_KEY: ${{ secrets.PIXEL_EAGLE_API_KEY }}

      - name: Post Pixel-Eagle comment to PR
        if: steps.pixel_eagle.outputs.success == 'true' && steps.metadata.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt('${{ steps.metadata.outputs.pr_number }}');
            const comparisonUrl = '${{ steps.pixel_eagle.outputs.comparison_url }}';
            const regressionCount = parseInt('${{ steps.pixel_eagle.outputs.regression_count }}') || 0;
            const workflowRunId = '${{ github.event.workflow_run.id }}';
            const headSha = '${{ steps.metadata.outputs.head_sha }}';
            
            let body = `## 📸 Visual Regression Testing (Pixel-Eagle)\n\n`;
            
            if (regressionCount > 0) {
              body += `⚠️ **${regressionCount} Visual Regression(s) Detected**\n\n`;
              body += `The screenshot shows ${regressionCount} pixel difference(s) compared to the baseline.\n`;
            } else {
              body += `✅ **All Visual Tests Passed**\n\n`;
              body += `No regressions detected — screenshot matches baseline.\n`;
            }
            
            if (comparisonUrl) {
              body += `\n[View Comparison Report](${comparisonUrl})`;
            }
            
            body += `\n\nCommit: [\`${headSha.substring(0, 7)}\`](https://github.com/${{ github.repository }}/commit/${headSha})`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
            
            console.log(`Posted Pixel-Eagle comparison to PR #${prNumber}`);

      - name: Post screenshot fallback comment (if Pixel-Eagle upload failed)
        if: steps.pixel_eagle.outputs.success == 'false' && steps.check_screenshot.outputs.screenshot_exists == 'true' && steps.metadata.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.metadata.outputs.pr_number }}');
            const workflowRunId = '${{ github.event.workflow_run.id }}';
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${workflowRunId}`;
            const headSha = '${{ steps.metadata.outputs.head_sha }}';
            
            // Read and encode screenshot as base64
            const imageBuffer = fs.readFileSync('output.png');
            const base64Image = imageBuffer.toString('base64');
            const imageSize = (imageBuffer.length / 1024).toFixed(2);
            
            let body = `## 📸 Screenshot Preview\n\n`;
            body += `⚠️ Pixel-Eagle API upload failed. Displaying screenshot directly.\n\n`;
            
            if (base64Image.length > 60000) {
              body += `✅ Screenshot captured successfully!\n\n[Download Screenshot](${artifactUrl}) (${imageSize} KB)`;
            } else {
              const imageDataUrl = 'data:image/png;base64,' + base64Image;
              body += `![Headless WGPU Screenshot](${imageDataUrl})\n\n✅ Screenshot captured successfully.`;
            }
            
            body += `\n\nCommit: [\`${headSha.substring(0, 7)}\`](https://github.com/${{ github.repository }}/commit/${headSha})`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
            
            console.log(`Posted fallback screenshot comment to PR #${prNumber}`);

      - name: Post failure message
        if: steps.check_screenshot.outputs.screenshot_exists == 'false' && steps.metadata.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt('${{ steps.metadata.outputs.pr_number }}');
            const workflowRunId = '${{ github.event.workflow_run.id }}';
            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${workflowRunId}`;
            
            const body = `## ⚠️ Screenshot Generation Failed\n\nThe headless WGPU application did not generate a screenshot.\n\nWorkflow Status: [\`${{ github.event.workflow_run.conclusion }}\`](${artifactUrl})\n\n[View Workflow Logs](${artifactUrl})`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
            
            console.log(`Posted failure message to PR #${prNumber}`);
