name: WGPU Headless Screenshot

on:
  pull_request:
    branches: [ main, master ]

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Minimal Software Vulkan Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Headless WGPU Application
        env:
          WGPU_BACKEND: vulkan
          GALLIUM_DRIVER: llvmpipe
        run: |
          cargo run --bin headless --release

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-screenshot
          path: output.png
