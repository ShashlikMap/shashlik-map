name: Post Screenshot to PR

on:
  workflow_run:
    workflows: ["WGPU Headless Screenshot"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-screenshot:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download screenshot artifact
        uses: actions/download-artifact@v4
        with:
          name: headless-screenshot
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check if screenshot exists
        id: check_screenshot
        run: |
          if [ -f output.png ]; then
            echo "screenshot_exists=true" >> $GITHUB_OUTPUT
          else
            echo "screenshot_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Post screenshot comment to PR
        if: steps.check_screenshot.outputs.screenshot_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            let prNumber = null;
            for (const pr of pullRequests) {
              if (pr.head.sha === '${{ github.event.workflow_run.head_sha }}') {
                prNumber = pr.number;
                break;
              }
            }
            
            if (!prNumber) {
              console.log('Could not find associated PR');
              return;
            }
            
            const imageBuffer = fs.readFileSync('output.png');
            const base64Image = imageBuffer.toString('base64');
            const imageDataUrl = 'data:image/png;base64,' + base64Image;
            
            const body = `## 📸 Screenshot Preview\n\n![Headless WGPU Screenshot](${imageDataUrl})\n\n✅ Screenshot captured successfully from headless WGPU application.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
            
            console.log(`Posted screenshot comment to PR #${prNumber}`);

      - name: Post no screenshot message
        if: steps.check_screenshot.outputs.screenshot_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            let prNumber = null;
            for (const pr of pullRequests) {
              if (pr.head.sha === '${{ github.event.workflow_run.head_sha }}') {
                prNumber = pr.number;
                break;
              }
            }
            
            if (!prNumber) return;
            
            const body = `## ⚠️ Screenshot Generation Failed\n\nThe headless WGPU application did not generate a screenshot. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}) for details.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });